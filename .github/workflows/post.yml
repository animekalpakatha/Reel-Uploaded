name: Post next reel

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test only, post = post next video now"
        type: choice
        options: [check, post]
        default: check

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth requests
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "check" ]; then python post.py --check; else python post.py; fi
      - name: Save queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "Update posted queue" && git push)
